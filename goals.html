<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build and track SMART financial goals in Pinch." />
    <meta name="theme-color" content="#102a43" />
    <title>Goals — Pinch.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="goals">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app is-ready" id="app">
      <aside class="sidebar">
        <a class="wordmark" href="index.html" aria-label="Pinch. overview"><span class="brand-mark" aria-hidden="true"></span><span>Pinch<span class="accent">.</span></span></a>
        <nav class="sidebar-nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html"><span aria-hidden="true">⌂</span>Overview</a>
          <a class="nav-link" href="accounts.html"><span aria-hidden="true">▣</span>Accounts</a>
          <a class="nav-link is-active" href="goals.html" aria-current="page"><span aria-hidden="true">◎</span>Goals</a>
          <a class="nav-link" href="activity.html"><span aria-hidden="true">↕</span>Activity</a>
        </nav>
        <button class="profile" type="button" aria-label="Open profile settings"><span class="avatar">MS</span><span><strong>Maya</strong><small>Student account</small></span><b aria-hidden="true">•••</b></button>
      </aside>

      <div class="workspace">
        <header class="mobile-header">
          <a class="wordmark" href="index.html" aria-label="Pinch. overview"><span class="brand-mark" aria-hidden="true"></span><span>Pinch<span class="accent">.</span></span></a>
          <button class="button button-primary button-compact" type="button" data-open-goal>＋ New</button>
        </header>

        <main id="main-content" class="content" tabindex="-1">
          <header class="page-header">
            <div><h1>Goals</h1><p>Specific. Measurable. Yours.</p></div>
            <button class="button button-primary" type="button" data-open-goal>＋ New goal</button>
          </header>

          <section class="goal-summary" aria-label="Goal summary">
            <div><span>Saved</span><strong class="private-money" id="goal-total">$1,120.00</strong></div>
            <div><span>Target</span><strong class="private-money" id="goal-target-total">$1,800.00</strong></div>
            <div><span>Overall</span><strong id="goal-overall-percent">62%</strong></div>
          </section>

          <section class="goal-detail-grid" id="goal-list" aria-label="Financial goals"></section>

          <section class="smart-strip" aria-label="SMART goal framework">
            <span><b>S</b>Specific</span><span><b>M</b>Measurable</span><span><b>A</b>Achievable</span><span><b>R</b>Relevant</span><span><b>T</b>Time-bound</span>
          </section>
        </main>

        <nav class="mobile-nav" aria-label="Mobile navigation">
          <a href="index.html"><span aria-hidden="true">⌂</span>Overview</a>
          <a href="accounts.html"><span aria-hidden="true">▣</span>Accounts</a>
          <a class="is-active" href="goals.html" aria-current="page"><span aria-hidden="true">◎</span>Goals</a>
          <a href="activity.html"><span aria-hidden="true">↕</span>Activity</a>
        </nav>
      </div>
    </div>

    <dialog class="modal" id="goal-modal" aria-labelledby="goal-title">
      <form id="goal-form">
        <div class="modal-heading"><h2 id="goal-title">New SMART goal</h2><button type="button" data-close-modal aria-label="Close">×</button></div>
        <label><span>Goal</span><input id="goal-name" type="text" maxlength="45" placeholder="Emergency fund" required /></label>
        <div class="form-grid">
          <label><span>Target</span><input id="goal-target" type="number" min="25" step="25" placeholder="$500" required /></label>
          <label><span>Target date</span><input id="goal-date" type="date" required /></label>
        </div>
        <label><span>Why it matters</span><input id="goal-reason" type="text" maxlength="70" placeholder="So one surprise expense won't derail my semester" required /></label>
        <div class="modal-actions"><button class="button button-secondary" type="button" data-close-modal>Cancel</button><button class="button button-primary" type="submit">Create goal</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
